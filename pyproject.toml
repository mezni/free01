[project]
name = "rag-project"
version = "0.1.0"
description = "Production-style RAG over telecom policy documents, built step by step."
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=5.0.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
only-include = ["src/cleaning.py", "src/parsing", "src/core", "src/rag"]
sources = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
