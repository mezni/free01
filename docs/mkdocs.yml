site_name: Telco RAG
site_description: Architecture, pipeline, security, quality, and operations documentation for the telco RAG platform
repo_url: https://github.com/mamezni/telco-rag

docs_dir: .
site_dir: ../site

exclude_docs: |
  mkdocs.yml

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  # Sections below are enabled as their pages are authored.
