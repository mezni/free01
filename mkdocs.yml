site_name: Enterprise RAG Documentation
site_description: Technical specifications, architecture, security, operations, and developer guides for the Enterprise RAG Platform.
site_author: Platform Engineering Team
site_url: https://docs.internal.enterprise.com/rag
repo_name: enterprise-rag
repo_url: https://github.com/your-org/enterprise-rag
edit_uri: edit/main/docs/
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    logo: material/file-document-plus-outline
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - 1. Architecture & System Specs:
      - Architecture Overview: 01-architecture/index.md
      - High-Level Design (HLD): 01-architecture/high-level-design.md
      - Low-Level Design (LLD): 01-architecture/low-level-design.md
      - API Specification: 01-architecture/api-specification.md
      - Vector Index & Schema: 01-architecture/vector-schema.md
      - Infrastructure & Network: 01-architecture/infrastructure-topology.md
  - 2. Ingestion & Data Lineage:
      - Data Pipeline Overview: 02-data-pipeline/index.md
      - Data Sources & Connectors: 02-data-pipeline/connectors-inventory.md
      - Parsing & Chunking Strategy: 02-data-pipeline/parsing-and-chunking.md
      - Data Lineage & Catalog: 02-data-pipeline/data-lineage-catalog.md
      - Re-indexing & Sync Runbook: 02-data-pipeline/reindexing-runbook.md
  - 3. Security & Governance:
      - Security Posture: 03-security-compliance/index.md
      - Access Control (ACL): 03-security-compliance/access-control-acl.md
      - PII & Data Protection: 03-security-compliance/pii-data-protection.md
      - Threat Model & Guardrails: 03-security-compliance/threat-model.md
      - Audit & Logging Policy: 03-security-compliance/audit-logging-policy.md
  - 4. Quality & Evaluation:
      - Quality Framework: 04-evaluation-quality/index.md
      - Evaluation Framework: 04-evaluation-quality/evaluation-framework.md
      - Golden Evaluation Dataset: 04-evaluation-quality/golden-dataset-guide.md
      - System Prompts & Safety: 04-evaluation-quality/system-prompts-guardrails.md
  - 5. Operations & DevOps:
      - Operations Overview: 05-operations/index.md
      - Deployment & CI/CD: 05-operations/deployment-cicd.md
      - Observability & Monitoring: 05-operations/observability-monitoring.md
      - Incident Response SOPs: 05-operations/incident-response.md
      - Capacity & Cost Planning: 05-operations/capacity-and-cost.md
  - 6. Developer & User Guides:
      - Developer Portal: 06-developer-guides/index.md
      - Quickstart & SDK Guide: 06-developer-guides/quickstart-sdk.md
      - End-User Guide: 06-developer-guides/end-user-guide.md
      - Release Notes & Changelog: 06-developer-guides/changelog.md

docs_dir: docs